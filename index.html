<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#eef2f7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<title>跳一跳 · Jump Jump</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:#eef2f7;
    font-family:-apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #c { display:block; touch-action:none; cursor:pointer; }

  /* ---------- HUD ---------- */
  #score {
    position:fixed; top:22px; left:30px; z-index:5; pointer-events:none;
    font-size:58px; font-weight:800; color:#4a5068; letter-spacing:2px;
    text-shadow:0 2px 0 rgba(255,255,255,.6), 0 6px 16px rgba(80,90,120,.15);
    transform-origin:left top;
  }
  #score.bump { animation:bump .22s cubic-bezier(.3,1.7,.5,1); }
  @keyframes bump { 0%{transform:scale(1);} 42%{transform:scale(1.17);} 100%{transform:scale(1);} }
  #level {
    position:fixed; top:88px; left:32px; z-index:5; pointer-events:none;
    font-size:13px; font-weight:700; color:#a8afc4; letter-spacing:2px;
  }
  #topRight {
    position:fixed; top:28px; right:26px; z-index:6;
    display:flex; align-items:center; gap:10px;
  }
  #bestLabel { font-size:15px; font-weight:600; color:#8b92a8; letter-spacing:1px; }
  #shield {
    font-size:19px; line-height:1; padding:6px 9px; border-radius:999px;
    background:rgba(247,183,49,.18); box-shadow:0 0 0 1.5px rgba(247,183,49,.55) inset;
    animation:pulse 1.6s ease-in-out infinite;
  }
  #shield.off { display:none; }
  @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
  .icobtn {
    border:0; background:rgba(255,255,255,.75); border-radius:999px;
    width:38px; height:38px; font-size:16px; cursor:pointer;
    box-shadow:0 3px 10px rgba(80,90,120,.14);
  }
  .icobtn:active { transform:scale(.92); }
  .icobtn.dim { opacity:.4; }

  #combo {
    position:fixed; top:120px; left:50%; transform:translateX(-50%); z-index:5;
    pointer-events:none; font-size:15px; font-weight:700; color:#e8a020;
    letter-spacing:1px; opacity:0; transition:opacity .25s;
  }
  #combo.on { opacity:1; }

  #toast {
    position:fixed; top:46%; left:50%; transform:translate(-50%,-50%) scale(.8); z-index:8;
    pointer-events:none; font-size:34px; font-weight:800; color:#e8a020;
    letter-spacing:4px; text-shadow:0 4px 18px rgba(232,160,32,.35);
    opacity:0; transition:opacity .3s, transform .3s;
  }
  #toast.on { opacity:1; transform:translate(-50%,-50%) scale(1); }

  #hint {
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:5;
    pointer-events:none; white-space:nowrap;
    font-size:14px; color:#7d8499; letter-spacing:1px;
    background:rgba(255,255,255,.72); padding:8px 18px; border-radius:999px;
    box-shadow:0 3px 12px rgba(80,90,120,.12);
    transition:opacity .4s;
  }
  .hidden { opacity:0 !important; pointer-events:none !important; }

  /* ---------- 覆盖层 ---------- */
  .overlay {
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:rgba(238,242,247,.66); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:opacity .28s; padding:20px;
  }
  .card {
    background:#fff; border-radius:26px; padding:32px 44px; text-align:center;
    box-shadow:0 24px 70px rgba(60,70,100,.20);
    animation:pop .32s cubic-bezier(.2,1.4,.4,1);
    max-width:92vw; max-height:92vh; overflow-y:auto;
  }
  @keyframes pop { from { transform:scale(.86); opacity:0; } to { transform:scale(1); opacity:1; } }
  h1 { margin:0 0 8px; font-size:46px; letter-spacing:10px; color:#3a3f5c; text-indent:10px; }
  .sub { margin:0 0 18px; font-size:15px; color:#8b92a8; letter-spacing:1px; }
  .btn {
    border:0; background:#3a3f5c; color:#fff; font-size:18px; font-weight:600;
    letter-spacing:6px; text-indent:6px; padding:14px 52px; border-radius:999px;
    cursor:pointer; box-shadow:0 8px 22px rgba(58,63,92,.35);
    transition:transform .12s;
  }
  .btn:hover { background:#454b6e; }
  .btn:active { transform:scale(.95); }
  .tiny { margin:16px 0 0; font-size:12.5px; color:#a4aabc; }
  .label { margin:0; font-size:15px; color:#8b92a8; letter-spacing:4px; }
  .big { font-size:76px; font-weight:800; color:#e8a020; margin:4px 0 2px; text-shadow:0 4px 14px rgba(232,160,32,.25); }
  .rec { font-size:15px; font-weight:700; color:#e8a020; margin:2px 0 6px; }

  /* 方块图鉴 */
  .dex { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin:0 0 22px; text-align:left; }
  .dex div {
    display:flex; align-items:center; gap:10px; font-size:12.5px; color:#5a6079;
    background:#f6f8fb; padding:9px 12px; border-radius:12px; line-height:1.35;
  }
  .dex b { font-size:15px; line-height:1; }
  .dex em { font-style:normal; color:#8b92a8; font-size:11.5px; display:block; }

  /* 结算统计 */
  .stats { display:flex; gap:14px; justify-content:center; margin:16px 0 22px; }
  .stats div {
    background:#f6f8fb; border-radius:14px; padding:10px 16px; min-width:66px;
  }
  .stats span { display:block; font-size:11.5px; color:#a4aabc; letter-spacing:1px; }
  .stats strong { display:block; font-size:22px; font-weight:800; color:#4a5068; margin-top:2px; }

  /* ---------- 难度模式 ---------- */
  .modes { display:flex; gap:10px; justify-content:center; margin:0 0 16px; }
  .mode {
    flex:1; border:0; cursor:pointer; border-radius:16px; padding:12px 8px;
    background:#f6f8fb; text-align:center; font-family:inherit;
    box-shadow:0 0 0 2px rgba(58,63,92,.08) inset;
    transition:transform .12s, background .18s, box-shadow .18s;
  }
  .mode:active { transform:scale(.96); }
  .mode b { display:block; font-size:16px; font-weight:800; color:#3a3f5c; letter-spacing:3px; }
  .mode span { display:block; font-size:11px; color:#8b92a8; margin-top:3px; line-height:1.4; }
  .mode.sel { background:#3a3f5c; box-shadow:0 0 0 2px #3a3f5c inset, 0 8px 20px rgba(58,63,92,.3); }
  .mode.sel b { color:#fff; }
  .mode.sel span { color:rgba(255,255,255,.72); }
  .mode.hard b { color:#c0392b; }
  .mode.hard.sel {
    background:linear-gradient(160deg,#c0392b,#7d2018);
    box-shadow:0 0 0 2px #8e2b20 inset, 0 8px 20px rgba(140,40,30,.35);
  }
  .mode.hard.sel b { color:#fff; }
  .tiprow { margin:0 0 20px; font-size:11.5px; color:#8b92a8; line-height:1.6; min-height:34px; }
  .tiprow.hard { color:#c0392b; }
  .linkbtn {
    border:0; background:none; font-family:inherit; font-size:12.5px; color:#8b92a8;
    cursor:pointer; text-decoration:underline; padding:6px 4px 0;
  }
  #modeBadge {
    position:fixed; top:110px; left:32px; z-index:5; pointer-events:none;
    font-size:11.5px; font-weight:800; letter-spacing:1.5px; padding:3px 10px; border-radius:999px;
    background:rgba(192,57,43,.12); color:#c0392b;
    box-shadow:0 0 0 1.5px rgba(192,57,43,.35) inset;
  }
  #modeBadge.off { display:none; }

  /* 超难模式的暗色舞台 */
  body.dark { background:#242a3d; }
  body.dark #score { color:#eef1fa; text-shadow:0 2px 0 rgba(0,0,0,.28), 0 6px 18px rgba(0,0,0,.4); }
  body.dark #level { color:#8d95b4; }
  body.dark #bestLabel { color:#8d95b4; }
  body.dark #hint { color:#b3bacf; background:rgba(255,255,255,.10); box-shadow:0 3px 12px rgba(0,0,0,.35); }
  body.dark .icobtn { background:rgba(255,255,255,.13); color:#e8ebf5; }
  body.dark #modeBadge {
    background:rgba(255,110,95,.18); color:#ff8574;
    box-shadow:0 0 0 1.5px rgba(255,110,95,.42) inset;
  }
  body.dark .overlay { background:rgba(24,28,42,.72); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="score">0</div>
<div id="level">第 1 关</div>
<div id="modeBadge" class="off">超难 ×2</div>
<div id="combo"></div>
<div id="toast"></div>
<div id="topRight">
  <span id="bestLabel">最佳 0</span>
  <span id="shield" class="off" title="护盾：掉落时抵消一次">🛡️</span>
  <button id="assist" class="icobtn" title="落点预测开关">🎯</button>
  <button id="mute" class="icobtn" title="声音开关">🔊</button>
</div>
<div id="hint" class="hidden">按住鼠标 / 空格键蓄力，松开起跳 · 落在圆圈中心 = 完美</div>

<div id="start" class="overlay">
  <div class="card">
    <h1>跳一跳</h1>
    <p class="sub">按住蓄力 · 松手起跳 · 越接近中心分越高</p>
    <div class="modes">
      <button class="mode sel" data-mode="normal"><b>普通</b><span>落点预测<br>边缘吸附</span></button>
      <button class="mode hard" data-mode="hard"><b>超难 ×2</b><span>全关闭辅助<br>身后方块崩塌</span></button>
    </div>
    <div class="dex">
      <div><b>🛒</b> 商店<span><em>停留越久加分越多</em></span></div>
      <div><b>🕳️</b> 井盖<span><em id="dexHole">2.4 秒内必须跳走</em></span></div>
      <div><b>↔️</b> 移动台<span><em>会滑动，需要预判</em></span></div>
      <div><b>✨</b> 小方块<span><em>又小又窄，命中 +3</em></span></div>
    </div>
    <p class="tiprow" id="startTip"></p>
    <button id="btnStart" class="btn">开始游戏</button>
    <p class="tiny">历史最佳 <b id="startBest">0</b> · 按 H 键切换难度</p>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <p class="label">本局得分</p>
    <div id="finalScore" class="big">0</div>
    <div id="newRec" class="rec">🏆 新纪录！</div>
    <div class="stats">
      <div><span>完美</span><strong id="stPerf">0</strong></div>
      <div><span>最高连击</span><strong id="stStreak">0</strong></div>
      <div><span>里程碑</span><strong id="stMile">0</strong></div>
    </div>
    <p class="tiny" id="overBest">历史最佳 0</p>
    <button id="btnRetry" class="btn">再来一局</button>
    <button id="btnSwitch" class="linkbtn">切换难度模式</button>
  </div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);

/* ================= 配置 ================= */
// 基线数值，难度模式在此之上做覆盖
const BASE = {
  chargeTime: 1.1,     // 蓄满所需秒数
  minDist: 88,         // 最短跳跃距离（世界单位）
  maxDist: 360,        // 最长跳跃距离
  perfectR: 13,        // 完美判定半径
  tol: 9,              // 落点容差（边缘宽度）
  magnet: 15,          // 落点边缘吸附半径：差一点点时拉回台面（超难模式为 0）
  h: 56,               // 方块高度
  shopTick: 0.7,       // 商店加分间隔（秒）
  shopMax: 6,          // 商店单次停留加分上限
  holeTime: 2.4,       // 井盖可停留时间（秒）
  shieldStreak: 3,     // 连击达到多少获得护盾
  milestone: 10,       // 每多少分一个里程碑
  hitLand: 0.045,      // 落地顿帧时长
  hitPerfect: 0.075,   // 完美落地顿帧更长
  // 难度曲线
  gapBase: 34, gapRand: 120, gapStep: 20,   // 平台间距 = base + rand(0..rand + lv*step)
  shrinkStep: 0.045, shrinkMin: 0.62,       // 每关缩小的比例与下限
  spChance: 0.10, spStep: 0.05, spMax: 0.45,// 特殊方块出现概率
  mvSpdA: 0.35, mvSpdB: 0.28,               // 移动台速度
};

// 超难模式：关掉所有辅助、收紧判定、加速难度曲线，得分 ×2 作为回报
const MODES = {
  normal: { name:'普通', mult:1, guide:true,  decay:false, cfg:{} },
  hard: {
    name:'超难', mult:2, guide:false, decay:true,
    cfg: {
      chargeTime: 0.78,        // 蓄力窗口更短，同样的手抖换算成更大的距离误差
      perfectR: 8, tol: 7, magnet: 0,   // 完美圈更小，且不再有边缘吸附
      holeTime: 1.3, shopMax: 3, shopTick: 0.85,
      shieldStreak: 6, milestone: 8,    // 护盾更难拿，但升级更快
      gapBase: 56, gapRand: 150, gapStep: 26,
      shrinkStep: 0.07, shrinkMin: 0.44,
      spChance: 0.34, spStep: 0.06, spMax: 0.78,
      mvSpdA: 0.58, mvSpdB: 0.42,
    },
  },
};

const CFG = Object.assign({}, BASE);
const DECAY_LIFE = 1.5;        // 崩塌方块从开始塌到消失的时长（秒）
let mode = 'normal', M = MODES.normal, THEME = null;

// 暗色舞台：超难模式换一套配色，一眼能看出不在普通局
const THEMES = {
  normal: {
    bg: ['#e8eefb', '#f3f6fb', '#e3e9f4'],
    hills: ['rgba(152,167,197,.34)', 'rgba(126,145,180,.34)'],
    cloud: 0.5, dark: false,
    body0: '#585d84', body1: '#3a3f63', base: '#2e3352',
    manhole: ['#767c92', '#5c6276', '#484d5e'],
    trail: '88,93,132',
  },
  hard: {
    bg: ['#242a3d', '#333b52', '#1b2030'],
    hills: ['rgba(96,112,152,.42)', 'rgba(58,72,108,.5)'],
    cloud: 0.18, dark: true,
    body0: '#cdd3e8', body1: '#8d95b8', base: '#6d769c',
    manhole: ['#a8b0c8', '#7f88a4', '#616a86'],   // 井盖改浅色，否则在暗背景上会隐身
    trail: '205,212,235',
  },
};

function applyMode(m) {
  mode = m; M = MODES[m];
  Object.assign(CFG, BASE, M.cfg);
  THEME = THEMES[mode];
  assist = M.guide;                 // 超难强制关闭落点预测
  best = loadBest();
  buildBg();
  syncModeUI();
}

const PALETTE = [
  ['#f9f4e8', '#e6dcc2', '#d3c7ab'],
  ['#fbd3c0', '#f0b096', '#e29a80'],
  ['#c9e4f6', '#a3cce8', '#8ab6d4'],
  ['#d8c9f0', '#bda8dc', '#a48fc7'],
  ['#c9edd8', '#a0d4b7', '#87bfa3'],
  ['#f9e2b8', '#e6c892', '#d2b27c'],
  ['#f6c9d4', '#e2a2b2', '#cf8b9f'],
];
const KIND_SKIN = {
  shop:    ['#f0d6f5', '#d3a8de', '#bb8cc8'],
  manhole: ['#767c92', '#5c6276', '#484d5e'],
  mover:   ['#c6e7f6', '#8fc6e2', '#74accb'],
  tiny:    ['#ffeab4', '#efd284', '#d8b865'],
};

/* ================= 画布 ================= */
const cvs = $('#c'), ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, bgGrad = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = W * DPR; cvs.height = H * DPR;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  S = Math.max(0.55, Math.min(1.35, Math.min(W, H) / 760));
  buildBg();
}
function buildBg() {
  if (!THEME) return;
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, THEME.bg[0]);
  bgGrad.addColorStop(0.5, THEME.bg[1]);
  bgGrad.addColorStop(1, THEME.bg[2]);
  document.body.style.background = THEME.bg[1];
}
window.addEventListener('resize', resize); resize();

/* 2:1 轴测投影：世界 (x,y,z) → 屏幕 */
const ANCHOR_X = 0.5, ANCHOR_Y = 0.62;
let camX = 0, camY = 0;
function proj(x, y, z) {
  const dx = x - camX, dy = y - camY;
  return [W * ANCHOR_X + (dx - dy) * S, H * ANCHOR_Y + (dx + dy) * 0.5 * S - z * S];
}

/* ================= 音效（WebAudio 合成，无外部资源） ================= */
let ac = null, muted = false;
function tone(f0, f1, dur, opt = {}) {
  if (muted) return;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime + (opt.delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = opt.type || 'sine';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(opt.vol || 0.05, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
const sJump    = p => tone(160 + 240 * p, 340 + 340 * p, 0.16, { type:'triangle', vol:0.045 });
const sLand    = () => tone(150, 70, 0.10, { vol:0.05 });
const sPerfect = st => {
  const f = 620 * Math.pow(1.12, st - 1);
  tone(f, f, 0.09, { vol:0.05 });
  tone(f * 1.5, f * 1.5, 0.13, { vol:0.05, delay:0.09 });
};
const sFall    = () => tone(320, 70, 0.45, { type:'sawtooth', vol:0.035 });
const sCoin    = n => tone(880 + n * 60, 1180 + n * 60, 0.09, { type:'square', vol:0.03 });
const sShield  = () => { tone(520, 780, 0.14, { vol:0.05 }); tone(780, 1040, 0.18, { vol:0.05, delay:0.14 }); };
const sMile    = () => [0, 0.12, 0.24, 0.40].forEach((d, i) =>
  tone(523 * Math.pow(1.26, i), 523 * Math.pow(1.26, i), 0.22, { vol:0.05, delay:d, type:'triangle' }));
const sWarn    = () => tone(300, 240, 0.10, { type:'square', vol:0.028 });
const sHole    = () => tone(180, 50, 0.5, { type:'sawtooth', vol:0.04 });
const sRumble  = () => tone(110, 45, 0.32, { type:'sawtooth', vol:0.022 });   // 身后方块塌落
const sSave    = () => { tone(300, 620, 0.2, { vol:0.05, type:'triangle' }); tone(620, 900, 0.24, { vol:0.05, delay:0.2 }); };

/* ================= 游戏状态 ================= */
let plats = [], cur = 0, lastDir = null, pid = 1;
let piece = null, flight = null, fall = null;
let state = 'ready';           // ready | aim | charging | flying | falling | over
let score = 0, best = 0, streak = 0, power = 0, newRecord = false;
let chargeT0 = 0, shake = null, overAt = 0;
let shield = false, assist = true;
let perfectCount = 0, maxStreak = 0, mileCount = 0, nextMile = CFG.milestone;
let offX = 0, offY = 0;        // 棋子相对所站平台中心的偏移（随移动台跟随）
let hitStop = 0, camPunch = 0; // 落地顿帧 / 相机下沉冲击
let texts = [], dusts = [], rings = [], trail = [], sparks = [];

best = loadBest();

const bestKey = () => 'jump-best' + (mode === 'hard' ? '-hard' : '');
function loadBest() { try { return +localStorage.getItem(bestKey()) || 0; } catch (e) { return 0; } }
function saveBest() { try { localStorage.setItem(bestKey(), best); } catch (e) {} }
function loadMode() { try { return localStorage.getItem('jump-mode') === 'hard' ? 'hard' : 'normal'; } catch (e) { return 'normal'; } }
function saveMode() { try { localStorage.setItem('jump-mode', mode); } catch (e) {} }

// 模式切换后的界面同步：按钮选中态、辅助开关、图鉴文案、最佳分
function syncModeUI() {
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('sel', b.dataset.mode === mode));
  document.body.classList.toggle('dark', THEME.dark);
  HILLS[0].col = THEME.hills[0]; HILLS[1].col = THEME.hills[1];
  KIND_SKIN.manhole = THEME.manhole;
  $('#assist').classList.toggle('dim', !assist);
  $('#assist').style.opacity = M.guide ? '' : '.25';
  $('#assist').title = M.guide ? '落点预测开关' : '超难模式无落点预测';
  $('#modeBadge').classList.toggle('off', mode !== 'hard');
  $('#dexHole').textContent = CFG.holeTime + ' 秒内必须跳走';
  const tip = $('#startTip');
  tip.classList.toggle('hard', mode === 'hard');
  tip.innerHTML = mode === 'hard'
    ? '无落点预测 · 无边缘吸附 · 完美圈更小<br>身后方块会崩塌 · 井盖仅 ' + CFG.holeTime + ' 秒<br>连击 ' + CFG.shieldStreak + ' 次才得护盾 · 得分 ×2'
    : '连击 ' + CFG.shieldStreak + ' 次得护盾 🛡️，掉落时抵消一次<br>落点预测可在右上角 🎯 关闭';
  updHUD();
}

/* ================= 平台生成 ================= */
// 难度：随分数提升，间距变大、方块变小、特殊方块变多
function levelOf() { return Math.floor(score / CFG.milestone); }

function pickKind(lv) {
  const pool = ['box', 'cyl'];
  if (lv >= 0) pool.push('shop');
  if (lv >= 1) pool.push('mover', 'mover');
  if (lv >= 2) pool.push('tiny', 'tiny');
  if (lv >= 3) pool.push('manhole', 'manhole');
  const chance = Math.min(CFG.spMax, CFG.spChance + lv * CFG.spStep);
  if (Math.random() > chance) return Math.random() < 0.35 ? 'cyl' : 'box';
  return pool[2 + ((Math.random() * (pool.length - 2)) | 0)];
}

function makePlat(x, y, opts = {}) {
  const lv = opts.lv || 0;
  const kind = opts.kind || pickKind(lv);
  const shrink = Math.max(CFG.shrinkMin, 1 - lv * CFG.shrinkStep);
  const p = { x, y, kind, id: pid++, dip: 0, dipV: 0, timer: 0, gained: 0, tick: 0, phase: Math.random() * TAU };
  if (kind === 'cyl' || kind === 'manhole') {
    p.r = (kind === 'manhole' ? 34 + Math.random() * 8 : 30 + Math.random() * 18) * (kind === 'manhole' ? 1 : shrink);
  } else if (kind === 'tiny') {
    p.sx = 15 + Math.random() * 5; p.sy = 15 + Math.random() * 5;
  } else if (kind === 'shop') {
    p.sx = 40 + Math.random() * 10; p.sy = 40 + Math.random() * 10;
  } else {
    p.sx = (26 + Math.random() * 24) * shrink;
    p.sy = (26 + Math.random() * 24) * shrink;
  }
  const c = opts.color || KIND_SKIN[kind] || PALETTE[(Math.random() * PALETTE.length) | 0];
  p.top = c[0]; p.left = c[1]; p.right = c[2];
  return p;
}
const halfAlong = (p, axis) => (p.kind === 'cyl' || p.kind === 'manhole')
  ? p.r : (axis === 'x' ? p.sx : p.sy);

function addPlat() {
  const last = plats[plats.length - 1];
  let dir;
  if (!lastDir) dir = Math.random() < 0.5 ? 'x' : 'y';
  else dir = (lastDir === 'x' && Math.random() < 0.75) ? 'y'
           : (lastDir === 'y' && Math.random() < 0.75) ? 'x' : lastDir;
  lastDir = dir;

  const lv = levelOf();
  const p = makePlat(0, 0, { lv });
  // 移动台先定摆幅：它摆到最远端时也必须还在射程内
  if (p.kind === 'mover') {
    p.mvAxis = dir === 'x' ? 'y' : 'x';       // 垂直于来向滑动
    p.mvAmp = Math.min(52, halfAlong(p, p.mvAxis) * 0.85 + 12);   // 摆幅与自身尺寸挂钩，始终留出命中窗口
    p.mvSpd = CFG.mvSpdA + Math.random() * CFG.mvSpdB;
  }

  const other = dir === 'x' ? 'y' : 'x';
  p.jumpAxis = dir;                 // 记录来向：跳跃方向由它决定，不再靠当前坐标猜
  // 站立的方块若正好沿这条轴滑动，起跳点会来回漂移 ±amp，射程要把这份摆幅让出来
  const mvBack = (last.mvAmp && last.mvAxis === dir) ? last.mvAmp : 0;
  const swing  = mvBack ? last[dir] - last.mvBase : 0;      // 当前摆动量
  const maxReach = CFG.maxDist - 24 - mvBack;
  const loBound  = CFG.minDist + 14 + mvBack;               // 摆到最近端也不能近到跳不过去
  const gap = CFG.gapBase + Math.random() * (CFG.gapRand + lv * CFG.gapStep);
  const want = Math.max(loBound,
               Math.min(maxReach, halfAlong(last, dir) + halfAlong(p, dir) + gap));
  // 以棋子的实际站位为基准摆放，且扣掉摆动量：站在移动台上时距离不会跟着漂
  const base   = last[dir] - swing;
  const anchor = (piece ? piece[dir] : last[dir]) - swing;
  const sep = halfAlong(last, dir) + halfAlong(p, dir) + 24;   // 至少不重叠
  p[dir] = Math.min(Math.max(anchor + want, base + sep), anchor + maxReach);
  p[other] = piece ? piece[other] : last[other];

  if (p.kind === 'mover') p.mvBase = p[p.mvAxis];
  p.born = performance.now();
  plats.push(p);
}

function platAt(px, py, tol) {
  for (let i = plats.length - 1; i >= 0; i--) {
    const p = plats[i];
    if (p.kind === 'cyl' || p.kind === 'manhole') {
      const dx = px - p.x, dy = py - p.y;
      if (dx * dx + dy * dy <= (p.r + tol) * (p.r + tol)) return p;
    } else if (Math.abs(px - p.x) <= p.sx + tol && Math.abs(py - p.y) <= p.sy + tol) return p;
  }
  return null;
}

/* ================= 流程 ================= */
function reset() {
  plats = []; lastDir = null; pid = 1;
  const first = makePlat(0, 0, { kind: 'box', color: ['#ece7db', '#d5cfbe', '#c2bba6'] });
  first.sx = 64; first.sy = 64;
  plats.push(first);
  piece = { x: 0, y: 0, z: 0, sq: 1, sqV: 0 };
  addPlat();
  cur = 0;
  flight = null; fall = null;
  score = 0; streak = 0; power = 0; newRecord = false;
  shield = false; offX = 0; offY = 0;
  perfectCount = 0; maxStreak = 0; mileCount = 0; nextMile = CFG.milestone;
  texts = []; dusts = []; rings = []; trail = []; sparks = []; shake = null;
  hitStop = 0; camPunch = 0;
  camX = 0; camY = 0;
  updHUD();
}

function startGame() {
  reset();
  state = 'aim';
  $('#start').classList.add('hidden');
  $('#over').classList.add('hidden');
  $('#hint').classList.remove('hidden');
  $('#hint').textContent = mode === 'hard'
    ? '没有落点预测 · 没有边缘吸附 · 身后的方块会塌'
    : '按住鼠标 / 空格键蓄力，松开起跳 · 落在圆圈中心 = 完美';
}

// 切换难度：只能在开局前 / 结算后切换，中途换模式不生效
function setMode(m) {
  if (m === mode) return;
  applyMode(m); saveMode();
  if (state === 'over') showStart();
}
function showStart() {
  state = 'ready';
  reset();
  $('#over').classList.add('hidden');
  $('#start').classList.remove('hidden');
}

function press() {
  if (state !== 'aim') return;
  state = 'charging';
  chargeT0 = performance.now();
  power = 0;
}

// 跳跃方向：锁定在两条等测对角线之一，由平台链走向决定
function jumpDir() {
  const tgt = plats[cur + 1], from = plats[cur];
  // 优先用生成时记录的来向轴：移动台漂移后，靠当前坐标猜方向会猜错
  if (tgt && tgt.jumpAxis) {
    const a = tgt.jumpAxis;
    const s = Math.sign(tgt[a] - piece[a]) || 1;
    return a === 'x' ? { dirX: s, dirY: 0 } : { dirX: 0, dirY: s };
  }
  if (!tgt) return { dirX: lastDir === 'y' ? 0 : 1, dirY: lastDir === 'y' ? 1 : 0 };
  const dirX = Math.abs(tgt.x - from.x) >= Math.abs(tgt.y - from.y) ? Math.sign(tgt.x - from.x) : 0;
  return { dirX, dirY: dirX === 0 ? Math.sign(tgt.y - from.y) || 1 : 0 };
}

function release() {
  if (state !== 'charging') return;
  const p = power;
  const d = CFG.minDist + p * (CFG.maxDist - CFG.minDist);
  const u = p;
  const { dirX, dirY } = jumpDir();
  flight = { t: 0, T: 0.44 + 0.26 * u, H: 22 + 0.26 * d, d, p, sx: piece.x, sy: piece.y, dirX, dirY };
  state = 'flying';
  sJump(p);
}

function addScore(n) {
  score += Math.round(n * M.mult);        // 超难模式得分 ×2
  while (score >= nextMile) { nextMile += CFG.milestone; milestone(); }
  if (score > best) { best = score; newRecord = true; saveBest(); }
  updHUD();
  bumpScore();
}

// 分数变化时数字弹一下
function bumpScore() {
  const el = $('#score');
  el.classList.remove('bump');
  void el.offsetWidth;      // 强制重排，让动画能重复触发
  el.classList.add('bump');
}

function milestone() {
  mileCount++;
  sMile();
  toast(`里程碑 · ${mileCount * CFG.milestone}`);
  const q = plats[cur];
  dustBurst(q.x, q.y, 30, 26, true);
  rings.push({ x: q.x, y: q.y, t: 0, dur: 0.8, gold: true });
  shake = { t: 0.2, amp: 3.5 };
}

function toast(txt) {
  const el = $('#toast');
  el.textContent = txt;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('on'), 1100);
}

function land() {
  piece.sq = 0.72; piece.sqV = 0; piece.z = 0;
  // 边缘吸附：差一点点没踩稳时把棋子拉回台面，消掉「就差一像素」的挫败感
  let q = platAt(piece.x, piece.y, CFG.tol);
  if (!q) {
    const near = platAt(piece.x, piece.y, CFG.tol + CFG.magnet);
    if (near) {
      if (near.kind === 'cyl' || near.kind === 'manhole') {
        const dx = piece.x - near.x, dy = piece.y - near.y;
        const d0 = Math.hypot(dx, dy) || 1, lim = near.r * 0.9;
        if (d0 > lim) { piece.x = near.x + dx / d0 * lim; piece.y = near.y + dy / d0 * lim; }
      } else {
        piece.x = Math.max(near.x - near.sx * 0.9, Math.min(near.x + near.sx * 0.9, piece.x));
        piece.y = Math.max(near.y - near.sy * 0.9, Math.min(near.y + near.sy * 0.9, piece.y));
      }
      q = near;
    }
  }
  if (!q) { startFall(); return; }
  q.dip = 1; q.dipV = 0;
  const from = plats[cur];
  const dist = Math.hypot(piece.x - q.x, piece.y - q.y);
  const perfect = (q !== from) && dist <= CFG.perfectR;

  if (q !== from) {
    const escaped = from && from.kind === 'manhole';   // 在井盖关闭前跳出
    cur = plats.indexOf(q);
    offX = piece.x - q.x; offY = piece.y - q.y;
    streak = perfect ? streak + 1 : 0;
    maxStreak = Math.max(maxStreak, streak);

    let gain = 1;
    if (perfect) {
      perfectCount++;
      gain = 2 * streak;
      rings.push({ x: q.x, y: q.y, t: 0, dur: 0.55 });
      rings.push({ x: q.x, y: q.y, t: 0, dur: 0.32, white: true });
      sPerfect(streak);
      dustBurst(q.x, q.y, 0, 12, true);
      sparkBurst(q.x, q.y, 8 + Math.min(8, streak * 2));   // 完美专属星芒
    } else {
      sLand();
      dustBurst(piece.x, piece.y, 0, 9, false);
    }
    if (q.kind === 'tiny') gain += 2;                       // 小方块额外奖励
    if (escaped) { gain += 2; from.escaped = true; }        // 井盖脱险额外奖励
    texts.push({ x: q.x, y: q.y, t: 0, big: perfect, color: perfect ? '#e8a020' : '#5a6079',
                 txt: (perfect ? `+${gain} ${streak > 1 ? '连击×' + streak : '完美'}` : `+${gain}`) });
    addScore(gain);

    // 连击达标发护盾
    if (streak > 0 && streak % CFG.shieldStreak === 0 && !shield) {
      shield = true; sShield(); toast('获得护盾 🛡️'); updHUD();
    }
    if (streak >= 2) showCombo(streak);

    q.timer = 0; q.tick = 0; q.gained = 0;
    addPlat();
    if (cur > 1) { const drop = cur - 1; plats.splice(0, drop); cur -= drop; }
    if (M.decay && from && from !== q) from.decay = 0;   // 超难：走过的方块开始崩塌
    $('#hint').classList.add('hidden');
  } else {
    streak = 0; showCombo(0);
    sLand();
    dustBurst(piece.x, piece.y, 0, 9, false);
  }
  shake = { t: perfect ? 0.16 : 0.11, amp: perfect ? 3.4 : 2.2 };
  hitStop = perfect ? CFG.hitPerfect : CFG.hitLand;   // 顿帧：命中越准，冲击越重
  camPunch = perfect ? 7 : 4.5;                       // 相机随之下沉再回弹
  power = 0;
  state = 'aim';
}

function showCombo(n) {
  const el = $('#combo');
  if (n >= 2) { el.textContent = `连击 ×${n} · 再来 ${CFG.shieldStreak - (n % CFG.shieldStreak)} 次得护盾`; el.classList.add('on'); }
  else el.classList.remove('on');
}

function startFall(noRescue) { state = 'falling'; fall = { vz: 60, bounced: false, rest: false, t: 0, noRescue: !!noRescue }; sFall(); }

function gameOver() {
  state = 'over';
  saveBest(); updHUD();
  $('#finalScore').textContent = score;
  $('#overBest').textContent = `历史最佳 ${best} · ${M.name}模式`;
  $('#stPerf').textContent = perfectCount;
  $('#stStreak').textContent = maxStreak;
  $('#stMile').textContent = mileCount;
  $('#newRec').style.display = (newRecord && score > 0) ? '' : 'none';
  $('#over').classList.remove('hidden');
  overAt = performance.now();
}

// 护盾救援：掉落时抵消一次，弹回所站平台
function rescue() {
  shield = false;
  const q = plats[cur] || plats[0];
  piece.x = q.x + offX; piece.y = q.y + offY; piece.z = 0;
  piece.sq = 0.7; piece.sqV = 0;
  fall = null; state = 'aim'; power = 0; streak = 0; showCombo(0);
  q.dip = 1.4; q.dipV = 0;
  rings.push({ x: q.x, y: q.y, t: 0, dur: 0.6, gold: true });
  dustBurst(q.x, q.y, 0, 20, true);
  sSave(); toast('护盾抵消！');
  updHUD();
  shake = { t: 0.25, amp: 4 };
}

function updHUD() {
  $('#score').textContent = score;
  $('#level').textContent = '第 ' + (levelOf() + 1) + ' 关';
  $('#bestLabel').textContent = '最佳 ' + best;
  $('#startBest').textContent = best;
  $('#shield').classList.toggle('off', !shield);
}

/* ================= 特效 ================= */
function dustBurst(x, y, z, n = 9, gold = false) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = 40 + Math.random() * 90;
    dusts.push({ x, y, z, z0: z,
                 vx: Math.cos(a) * v, vy: Math.sin(a) * v, vz: 15 + Math.random() * 45,
                 t: 0, life: 0.3 + Math.random() * 0.25,
                 size: 1.8 + Math.random() * 2.4, gold });
  }
}

// 完美命中的星芒：从落点向外放射的短线
function sparkBurst(x, y, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + Math.random() * 0.35;
    sparks.push({ x, y, a, len: 14 + Math.random() * 24, v: 150 + Math.random() * 140,
                  t: 0, life: 0.34 + Math.random() * 0.16 });
  }
}

const cloudSpr = document.createElement('canvas');
cloudSpr.width = cloudSpr.height = 160;
{
  const g = cloudSpr.getContext('2d');
  const rg = g.createRadialGradient(80, 80, 8, 80, 80, 78);
  rg.addColorStop(0, 'rgba(255,255,255,.95)');
  rg.addColorStop(0.55, 'rgba(255,255,255,.55)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 160, 160);
}
const clouds = Array.from({ length: 5 }, () => ({
  fx: Math.random(), fy: Math.random(), s: 0.7 + Math.random() * 1.3, v: 5 + Math.random() * 9,
}));
const wrap = (v, m) => ((v % m) + m) % m;

/* ================= 更新 ================= */
function update(dt, now) {
  const raw = dt;
  if (hitStop > 0) { hitStop -= raw; dt *= 0.16; }        // 落地顿帧：短暂近乎静止，放大冲击感
  camPunch += (0 - camPunch) * Math.min(1, raw * 11);      // 相机下沉后回弹
  // 超难：身后走过的方块塌落消失，逼你一直往前
  if (M.decay) {
    for (let i = plats.length - 1; i >= 0; i--) {
      const p = plats[i];
      if (p.decay == null || i === cur) continue;
      p.decay += dt;
      if (p.decay > 0.8 && !p.puffed) { p.puffed = 1; dustBurst(p.x, p.y, 0, 12, false); sRumble(); }
      if (p.decay > DECAY_LIFE) { plats.splice(i, 1); if (i < cur) cur--; }
    }
  }

  // 移动台滑动
  for (const p of plats) {
    if (p.kind === 'mover') p[p.mvAxis] = p.mvBase + Math.sin(now / 1000 * p.mvSpd * TAU + p.phase) * p.mvAmp;
  }
  // 站在移动台上 → 棋子跟随
  const standing = plats[cur];
  if (standing && standing.kind === 'mover' && (state === 'aim' || state === 'charging')) {
    piece.x = standing.x + offX; piece.y = standing.y + offY;
  }

  if (state === 'charging') {
    power = Math.min(1, (now - chargeT0) / 1000 / CFG.chargeTime);
    piece.sq = 1 - 0.42 * power;
  } else if (state === 'ready') {
    piece.sq = 1 + 0.02 * Math.sin(now / 300);
  } else if (state === 'flying') {
    flight.t += dt;
    const u = Math.min(1, flight.t / flight.T);
    piece.x = flight.sx + flight.dirX * flight.d * u;
    piece.y = flight.sy + flight.dirY * flight.d * u;
    piece.z = flight.H * 4 * u * (1 - u);
    piece.sq = 1 + 0.16 * Math.sin(Math.PI * Math.pow(u, 0.72));   // 起跳拉伸，空中渐收
    trail.push({ x: piece.x, y: piece.y, z: piece.z, t: 0 });
    if (u >= 1) land();
  } else if (state === 'falling') {
    if (shield && !fall.noRescue && fall.vz > 0 && piece.z < -18) { rescue(); }
    else {
      fall.vz += 2200 * dt;
      piece.z -= fall.vz * dt;
      if (piece.z <= -CFG.h) {
        piece.z = -CFG.h;
        if (!fall.bounced) {
          fall.bounced = true;
          fall.vz = -Math.abs(fall.vz) * 0.32;
          piece.sq = 0.8; piece.sqV = 0;
          dustBurst(piece.x, piece.y, -CFG.h, 8, false);
        } else { fall.rest = true; fall.vz = 0; }
      }
      if (fall.rest) { fall.t += dt; if (fall.t > 0.55) gameOver(); }
    }
  }

  // 站立平台的持续判定：商店加分 / 井盖倒计时
  if (state === 'aim' || state === 'charging') {
    const q = plats[cur];
    if (q) {
      q.timer += dt;
      if (q.kind === 'shop') {
        if (q.gained < CFG.shopMax) {
          q.tick += dt;
          if (q.tick >= CFG.shopTick) {
            q.tick -= CFG.shopTick; q.gained++;
            addScore(1); sCoin(q.gained);
            texts.push({ x: q.x, y: q.y, t: 0, color: '#8e5bb5', txt: '+1' });
          }
        }
      } else if (q.kind === 'manhole') {
        const left = CFG.holeTime - q.timer;
        if (left <= 0.9 && !q.warned) { q.warned = true; sWarn(); }
        if (left <= 0) { sHole(); startFall(true); }   // 井盖打开 → 不可被护盾救回
      }
    }
  }

  const tx = state === 'flying' ? flight.sx : piece.x;
  const ty = state === 'flying' ? flight.sy : piece.y;
  const k = Math.min(1, dt * 5.5);
  camX += (tx - camX) * k;
  camY += (ty - camY) * k;

  if (shake) { shake.t -= dt; if (shake.t <= 0) shake = null; }

  if (state === 'aim' || state === 'charging' || state === 'falling' || state === 'over') {
    piece.sqV += ((1 - piece.sq) * 130 - piece.sqV * 11) * dt;
    piece.sq += piece.sqV * dt;
  }
  for (const p of plats) {
    if (p.dip || p.dipV) {
      p.dipV += (-p.dip * 150 - p.dipV * 11) * dt;
      p.dip += p.dipV * dt;
      if (Math.abs(p.dip) < 0.002 && Math.abs(p.dipV) < 0.02) { p.dip = 0; p.dipV = 0; }
    }
  }

  texts = texts.filter(t => (t.t += dt) < 0.95);
  rings = rings.filter(r => (r.t += dt) < r.dur);
  sparks = sparks.filter(s => (s.t += dt) < s.life);
  trail = trail.filter(t => (t.t += dt) < 0.22);
  dusts = dusts.filter(d => {
    d.t += dt;
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vx *= 1 - 3.5 * dt; d.vy *= 1 - 3.5 * dt;
    d.vz -= 130 * dt; d.z += d.vz * dt;
    if (d.z < d.z0) { d.z = d.z0; d.vz *= -0.3; }
    return d.t < d.life;
  });
}

/* ================= 绘制 ================= */
// 颜色明暗微调，用于顶面 / 侧面渐变
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = k => Math.max(0, Math.min(255, ((n >> k) & 255) + amt * 255)) | 0;
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}

// 柔和阴影贴图（离屏预渲染，避免每帧重建渐变）
const shadowSpr = document.createElement('canvas');
shadowSpr.width = shadowSpr.height = 128;
{
  const g = shadowSpr.getContext('2d');
  const rg = g.createRadialGradient(64, 64, 1, 64, 64, 62);
  rg.addColorStop(0, 'rgba(48,60,98,.36)');
  rg.addColorStop(0.5, 'rgba(48,60,98,.17)');
  rg.addColorStop(1, 'rgba(48,60,98,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
}

// 远景山峦：两层正弦轮廓，随相机做视差，给场景补上纵深
const HILLS = [
  { seed: 0.7, amp: 0.052, base: 0.585, par: 0.18, col: 'rgba(152,167,197,.34)' },
  { seed: 2.9, amp: 0.072, base: 0.655, par: 0.35, col: 'rgba(126,145,180,.34)' },
];
function hillY(u, sd) {
  return Math.sin(u * 3.1 + sd) * 0.55 + Math.sin(u * 7.7 + sd * 2.3) * 0.3 + Math.sin(u * 14.3 + sd * 3.9) * 0.14;
}
function drawHills() {
  const shift = -(camX + camY) * S / W;   // 相机位移换算成 0~1 的采样偏移
  for (const hl of HILLS) {
    const baseY = H * hl.base, amp = H * hl.amp, sd = shift * hl.par;
    ctx.fillStyle = hl.col;
    ctx.beginPath();
    ctx.moveTo(-40, H);
    for (let i = 0; i <= 72; i++) {
      const u = i / 72;
      ctx.lineTo(-40 + u * (W + 80), baseY - hillY(u + sd, hl.seed) * amp);
    }
    ctx.lineTo(W + 40, H);
    ctx.closePath(); ctx.fill();
  }
}

function bornScale(p, now) {
  if (!p.born) return 1;
  const u = Math.min(1, (now - p.born) / 300);
  return 0.5 + 0.5 * (1 - Math.pow(1 - u, 3));
}
function bornAlpha(p, now) {
  if (!p.born) return 1;
  return Math.min(1, (now - p.born) / 200);
}

function drawShadow(p, now) {
  const dc = p.decay == null ? -1 : p.decay;
  if (dc > DECAY_LIFE) return;
  const sc = bornScale(p, now);
  const sink = sinkOf(p);
  const c = proj(p.x, p.y, -CFG.h * sc - sink);
  const rx = ((p.kind === 'cyl' || p.kind === 'manhole') ? p.r * 1.45 : (p.sx + p.sy) * 0.7) * S * sc;
  ctx.globalAlpha = dc < 0 ? 1 : Math.max(0, 1 - dc / (DECAY_LIFE * 0.8));
  ctx.drawImage(shadowSpr, c[0] - rx, c[1] + 5 * S - rx * 0.5, rx * 2, rx);
  ctx.globalAlpha = 1;
}

// 崩塌中的方块：加速下沉
function sinkOf(p) {
  if (p.decay == null) return 0;
  return Math.pow(p.decay / DECAY_LIFE, 2) * 190;
}

// 顶面四个角（2:1 轴测），供特殊标记绘制复用
function topPoly(c, sx2, sy2) {
  return {
    A: [c[0] + (sy2 - sx2), c[1] - (sx2 + sy2) / 2],
    B: [c[0] + (sx2 + sy2), c[1] + (sx2 - sy2) / 2],
    C: [c[0] + (sx2 - sy2), c[1] + (sx2 + sy2) / 2],
    D: [c[0] - (sx2 + sy2), c[1] + (sy2 - sx2) / 2],
  };
}

// 顶面局部坐标 → 屏幕（u,v ∈ [-1,1] 的顶面对称轴）
function topPoint(c, sx2, sy2, u, v) {
  return [c[0] + (u * sx2 + v * sy2), c[1] + (v * sx2 - u * sy2) / 2];
}

function drawPlat(p, now) {
  const dc = p.decay == null ? -1 : p.decay;
  if (dc > DECAY_LIFE) return;
  const sc = bornScale(p, now), al = bornAlpha(p, now);
  if (sc <= 0.01) return;
  const h = CFG.h * S * sc;
  const c = proj(p.x, p.y, -(p.dip || 0) * 4 - sinkOf(p));
  // 崩塌：先抖一下再淡出
  if (dc >= 0) {
    ctx.globalAlpha = al * Math.max(0, 1 - Math.pow(dc / DECAY_LIFE, 1.7));
    c[0] += Math.sin(dc * 46) * 2.2 * S * Math.min(1, dc);
  } else {
    ctx.globalAlpha = al;
  }

  if (p.kind === 'cyl' || p.kind === 'manhole') {
    const r = p.r * S * sc;
    const gs = ctx.createLinearGradient(0, c[1], 0, c[1] + h);
    gs.addColorStop(0, shade(p.right, 0.05)); gs.addColorStop(1, shade(p.right, -0.12));
    ctx.fillStyle = gs;
    ctx.beginPath();
    ctx.moveTo(c[0] - r, c[1]);
    ctx.lineTo(c[0] - r, c[1] + h);
    ctx.ellipse(c[0], c[1] + h, r, r * 0.5, 0, Math.PI, 0, true);
    ctx.lineTo(c[0] + r, c[1]);
    ctx.ellipse(c[0], c[1], r, r * 0.5, 0, 0, Math.PI, false);
    ctx.closePath(); ctx.fill();
    const gt = ctx.createLinearGradient(c[0] - r, c[1] - r * 0.5, c[0] + r, c[1] + r * 0.5);
    gt.addColorStop(0, shade(p.top, 0.10)); gt.addColorStop(1, shade(p.top, -0.06));
    ctx.fillStyle = gt;
    ctx.beginPath(); ctx.ellipse(c[0], c[1], r, r * 0.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = shade(p.top, -0.20); ctx.lineWidth = 1; ctx.stroke();
  } else {
    const sx = p.sx * S * sc, sy = p.sy * S * sc;
    const q = topPoly(c, sx, sy);
    const gL = ctx.createLinearGradient(0, q.D[1], 0, q.D[1] + h);
    gL.addColorStop(0, shade(p.left, 0.03)); gL.addColorStop(1, shade(p.left, -0.14));
    ctx.fillStyle = gL;
    ctx.beginPath();
    ctx.moveTo(q.D[0], q.D[1]); ctx.lineTo(q.C[0], q.C[1]);
    ctx.lineTo(q.C[0], q.C[1] + h); ctx.lineTo(q.D[0], q.D[1] + h);
    ctx.closePath(); ctx.fill();
    const gR = ctx.createLinearGradient(0, q.B[1], 0, q.B[1] + h);
    gR.addColorStop(0, shade(p.right, 0.03)); gR.addColorStop(1, shade(p.right, -0.14));
    ctx.fillStyle = gR;
    ctx.beginPath();
    ctx.moveTo(q.B[0], q.B[1]); ctx.lineTo(q.C[0], q.C[1]);
    ctx.lineTo(q.C[0], q.C[1] + h); ctx.lineTo(q.B[0], q.B[1] + h);
    ctx.closePath(); ctx.fill();
    const gT = ctx.createLinearGradient(q.A[0], q.A[1], q.C[0], q.C[1]);
    gT.addColorStop(0, shade(p.top, 0.11)); gT.addColorStop(1, shade(p.top, -0.06));
    ctx.fillStyle = gT;
    ctx.beginPath();
    ctx.moveTo(q.A[0], q.A[1]); ctx.lineTo(q.B[0], q.B[1]);
    ctx.lineTo(q.C[0], q.C[1]); ctx.lineTo(q.D[0], q.D[1]);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(p.top, -0.20); ctx.lineWidth = 1; ctx.stroke();
  }

  drawMark(p, c, sc, now);

  // 中心点 + 完美判定圈
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(c[0], c[1], 5 * S * sc, 2.5 * S * sc, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(c[0], c[1], CFG.perfectR * S * sc, CFG.perfectR * S * sc * 0.5, 0, 0, TAU);
  ctx.stroke();

  ctx.globalAlpha = 1;
}

// 各类方块的专属顶面标记与状态指示
function drawMark(p, c, sc, now) {
  const r = (p.kind === 'cyl' || p.kind === 'manhole') ? p.r : Math.min(p.sx, p.sy);
  const R = r * S * sc;

  if (p.kind === 'manhole') {
    ctx.strokeStyle = 'rgba(255,255,255,.30)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(c[0], c[1], R * (0.32 + i * 0.24), R * (0.32 + i * 0.24) * 0.5, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.42)';
    ctx.beginPath();
    ctx.moveTo(c[0] - R * 0.62, c[1]); ctx.lineTo(c[0] + R * 0.62, c[1]);
    ctx.moveTo(c[0], c[1] - R * 0.31); ctx.lineTo(c[0], c[1] + R * 0.31);
    ctx.stroke();
    // 倒计时环：红环走满即坠落
    if ((state === 'aim' || state === 'charging') && plats[cur] === p) {
      const u = Math.min(1, p.timer / CFG.holeTime);
      ctx.strokeStyle = `rgba(226,75,74,${(0.35 + 0.5 * u).toFixed(3)})`;
      ctx.lineWidth = 3.2 * S;
      ctx.beginPath();
      ctx.ellipse(c[0], c[1], R * 1.18, R * 1.18 * 0.5, 0, -Math.PI / 2, -Math.PI / 2 + u * TAU);
      ctx.stroke();
    }
    return;
  }

  if (p.kind === 'shop') {
    // 招牌：一小片斜屋顶 + 门
    const w = p.sx * S * sc, d = p.sy * S * sc;
    const roof = topPoint(c, w, d, 0.1, -0.62);
    ctx.fillStyle = '#a25fbf';
    ctx.beginPath();
    ctx.moveTo(roof[0], roof[1] - 14 * S * sc);
    ctx.lineTo(roof[0] + 15 * S * sc, roof[1] - 5 * S * sc);
    ctx.lineTo(roof[0] - 15 * S * sc, roof[1] - 5 * S * sc);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(120,70,150,.55)';
    const door = topPoint(c, w, d, 0.05, 0.12);
    ctx.fillRect(door[0] - 7 * S * sc, door[1] - 11 * S * sc, 14 * S * sc, 13 * S * sc);
    // 停留加分进度点
    if (p.gained > 0) {
      ctx.fillStyle = '#8e5bb5';
      for (let i = 0; i < p.gained; i++) {
        const a = -Math.PI / 2 + (i - (CFG.shopMax - 1) / 2) * 0.34;
        ctx.beginPath();
        ctx.ellipse(c[0] + Math.cos(a) * R * 1.05, c[1] + Math.sin(a) * R * 0.52 - 6 * S, 2.6 * S, 2.6 * S, 0, 0, TAU);
        ctx.fill();
      }
    }
    return;
  }

  if (p.kind === 'mover') {
    const w = p.sx * S * sc, d = p.sy * S * sc;
    const dir = p.mvAxis === 'x' ? [1, 0] : [0, 1];
    const ph = Math.sin(now / 1000 * p.mvSpd * TAU + p.phase + Math.PI / 2);
    const sgn = ph >= 0 ? 1 : -1;
    ctx.strokeStyle = 'rgba(30,90,130,.55)';
    ctx.lineWidth = 2.4 * S;
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      const b = topPoint(c, w, d, dir[0] * s * 0.42, dir[1] * s * 0.42);
      const t = topPoint(c, w, d, dir[0] * (s * 0.42 + sgn * 0.5), dir[1] * (s * 0.42 + sgn * 0.5));
      ctx.beginPath(); ctx.moveTo(b[0], b[1]); ctx.lineTo(t[0], t[1]); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(t[0], t[1]);
      ctx.lineTo(t[0] - dir[0] * sgn * 5 * S - dir[1] * 2.5 * S, t[1] - dir[0] * 2.5 * S - dir[1] * sgn * 5 * S);
      ctx.moveTo(t[0], t[1]);
      ctx.lineTo(t[0] - dir[0] * sgn * 5 * S + dir[1] * 2.5 * S, t[1] + dir[0] * 2.5 * S - dir[1] * sgn * 5 * S);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
    return;
  }

  if (p.kind === 'tiny') {
    ctx.strokeStyle = 'rgba(200,150,40,.75)';
    ctx.lineWidth = 2 * S;
    ctx.strokeRect(c[0] - p.sx * S * sc, c[1] - p.sy * S * sc * 0.5, p.sx * S * sc * 2, p.sy * S * sc);
    return;
  }
}

function drawPieceShadow() {
  const shZ = piece.z < 0 ? -CFG.h : 0;
  const sh = proj(piece.x, piece.y, shZ);
  const fade = Math.max(0, 1 - Math.max(0, piece.z) / 240);
  ctx.fillStyle = `rgba(58,70,110,${(0.26 * fade).toFixed(3)})`;
  ctx.beginPath();
  ctx.ellipse(sh[0], sh[1], 13 * S * (1 + Math.max(0, piece.z) / 400), 6.5 * S * (1 + Math.max(0, piece.z) / 400), 0, 0, TAU);
  ctx.fill();
}

function drawPieceBody(now) {
  const [px, py] = proj(piece.x, piece.y, piece.z);
  ctx.save();
  ctx.translate(px, py);
  if (state === 'charging' && power >= 1) ctx.translate(Math.sin(now / 42) * 1.7 * S, 0); // 满蓄力抖动提示
  const k = piece.sq;
  ctx.scale(1 + (1 - k) * 0.55, k);

  const w = 12.5 * S, hh = 32 * S, r = w * 0.60, hy = -hh + r;

  // 连击光晕
  if (streak >= 2 && (state === 'aim' || state === 'charging')) {
    const gl = ctx.createRadialGradient(0, -hh * 0.45, 1, 0, -hh * 0.45, 40 * S);
    gl.addColorStop(0, 'rgba(247,183,49,.36)');
    gl.addColorStop(1, 'rgba(247,183,49,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.ellipse(0, -hh * 0.45, 40 * S, 40 * S, 0, 0, TAU); ctx.fill();
  }

  ctx.fillStyle = THEME.base;
  ctx.beginPath(); ctx.ellipse(0, -1, w * 1.06, w * 0.42, 0, 0, TAU); ctx.fill();

  const g = ctx.createLinearGradient(0, -hh, 0, 0);
  g.addColorStop(0, THEME.body0); g.addColorStop(1, THEME.body1);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-w, -1);
  ctx.bezierCurveTo(-w * 1.06, -hh * 0.30, -r, -hh * 0.36, -r, hy);
  ctx.arc(0, hy, r, Math.PI, 0);
  ctx.bezierCurveTo(r, -hh * 0.36, w * 1.06, -hh * 0.30, w, -1);
  ctx.quadraticCurveTo(0, w * 0.5, -w, -1);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(-r * 0.34, hy - r * 0.34, r * 0.30, r * 0.17, -0.6, 0, TAU); ctx.fill();

  if (state === 'charging') {
    const rr = w * 2.2;
    ctx.strokeStyle = 'rgba(247,183,49,.22)';
    ctx.lineWidth = 3.5 * S;
    ctx.beginPath(); ctx.ellipse(0, 0, rr, rr * 0.55, 0, 0, TAU); ctx.stroke();
    const blink = power >= 1 ? 0.45 + 0.55 * Math.abs(Math.sin(now / 70)) : 1;   // 蓄满后闪烁
    ctx.strokeStyle = `rgba(247,183,49,${(0.95 * blink).toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(0, 0, rr, rr * 0.55, 0, -Math.PI / 2, -Math.PI / 2 + power * TAU);
    ctx.stroke();
  }
  ctx.restore();
}

// 落点预测：蓄力时显示预计落点圈
function drawAimGuide() {
  if (!assist || state !== 'charging') return;
  const d = CFG.minDist + power * (CFG.maxDist - CFG.minDist);
  const { dirX, dirY } = jumpDir();
  const lx = piece.x + dirX * d, ly = piece.y + dirY * d;
  const from = proj(piece.x, piece.y, 0);
  const to = proj(lx, ly, 0);

  ctx.setLineDash([5 * S, 5 * S]);
  ctx.strokeStyle = 'rgba(90,110,160,.35)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(from[0], from[1]); ctx.lineTo(to[0], to[1]); ctx.stroke();
  ctx.setLineDash([]);

  const hit = platAt(lx, ly, CFG.tol);
  const col = hit ? 'rgba(61,140,110,.85)' : 'rgba(200,90,90,.7)';
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.ellipse(to[0], to[1], 15 * S, 7.5 * S, 0, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(to[0], to[1], 2.6 * S, 1.4 * S, 0, 0, TAU); ctx.fill();
}

// 飞行拖尾残影
function drawTrail() {
  for (const t of trail) {
    const u = t.t / 0.22, a = (1 - u) * 0.32;
    const c = proj(t.x, t.y, t.z);
    ctx.fillStyle = `rgba(${THEME.trail},${a.toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(c[0], c[1] - 13 * S, 10 * S * (1 - u * 0.6), 5 * S * (1 - u * 0.6), 0, 0, TAU);
    ctx.fill();
  }
}

function drawEffects() {
  // 完美命中星芒
  ctx.lineCap = 'round';
  for (const s of sparks) {
    const u = s.t / s.life;
    const r0 = s.v * s.t * (1 - u * 0.45), r1 = r0 + s.len * (1 - u);
    const p0 = proj(s.x + Math.cos(s.a) * r0, s.y + Math.sin(s.a) * r0, 10);
    const p1 = proj(s.x + Math.cos(s.a) * r1, s.y + Math.sin(s.a) * r1, 10);
    ctx.strokeStyle = `rgba(240,178,60,${(0.92 * (1 - u)).toFixed(3)})`;
    ctx.lineWidth = 2.6 * S * (1 - u);
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
  }
  ctx.lineCap = 'butt';

  for (const r of rings) {
    const c = proj(r.x, r.y, 0);
    const u = Math.min(1, r.t / r.dur);
    const rad = (r.white ? 6 + 36 * u : CFG.perfectR + (r.gold ? 90 : 65) * u) * S;
    const a = (r.white ? 0.9 : 0.85) * (1 - u);
    ctx.strokeStyle = r.white ? `rgba(255,255,255,${a.toFixed(3)})`
      : r.gold ? `rgba(232,160,32,${a.toFixed(3)})` : `rgba(232,160,32,${a.toFixed(3)})`;
    ctx.lineWidth = Math.max(0.5, (r.white ? 2.5 : 3) * S * (1 - u));
    ctx.beginPath(); ctx.ellipse(c[0], c[1], rad, rad * 0.5, 0, 0, TAU); ctx.stroke();
  }
  for (const d of dusts) {
    const c = proj(d.x, d.y, d.z);
    const a = 1 - d.t / d.life;
    const r = d.size * S * (1 + (d.t / d.life) * 1.6);
    ctx.fillStyle = d.gold
      ? `rgba(235,168,50,${(0.75 * a).toFixed(3)})`
      : `rgba(125,133,158,${(0.5 * a).toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(c[0], c[1], r, r * 0.55, 0, 0, TAU); ctx.fill();
  }
  ctx.textAlign = 'center';
  for (const t of texts) {
    const c = proj(t.x, t.y, 8 + 60 * t.t);
    const a = 1 - Math.pow(t.t / 0.95, 1.4);
    ctx.font = `800 ${(t.big ? 22 : 16) * Math.max(1, S)}px -apple-system, "PingFang SC", sans-serif`;
    ctx.fillStyle = t.color;
    ctx.globalAlpha = a;
    ctx.fillText(t.txt, c[0], c[1]);
    ctx.globalAlpha = 1;
  }
}

function drawClouds(now) {
  for (const c of clouds) {
    const x = wrap(c.fx * (W + 400) + now / 1000 * c.v, W + 400) - 200;
    const y = wrap(c.fy * (H + 300) - (camX + camY) * S * 0.02, H + 300) - 150;
    const s = c.s * Math.min(W, H) / 4;
    ctx.globalAlpha = THEME.cloud;
    ctx.drawImage(cloudSpr, x - s, y - s, s * 2, s * 2);
    ctx.globalAlpha = 1;
  }
}

function topKeyAt(x, y) {
  let k = x + y;
  for (const p of plats) {
    const inside = (p.kind === 'cyl' || p.kind === 'manhole')
      ? (x - p.x) ** 2 + (y - p.y) ** 2 <= p.r * p.r
      : Math.abs(x - p.x) <= p.sx && Math.abs(y - p.y) <= p.sy;
    if (inside) k = Math.max(k, p.x + p.y + 0.01);
  }
  return k;
}

function render(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  drawHills();
  drawClouds(now);

  if (shake) {
    const a = shake.amp * Math.min(1, shake.t / 0.12);
    ctx.translate((Math.random() - 0.5) * 2 * a, (Math.random() - 0.5) * 2 * a);
  }
  if (Math.abs(camPunch) > 0.05) ctx.translate(0, camPunch);   // 落地冲击：画面下沉再回弹

  for (const p of plats) drawShadow(p, now);
  drawAimGuide();

  const airborne = state === 'flying' || state === 'falling' || state === 'over';
  const items = plats.map(p => ({ k: p.x + p.y, p }));
  items.push({ k: topKeyAt(piece.x, piece.y) + 0.002, shadow: true });
  items.push({ k: airborne ? 1e9 - 1 : topKeyAt(piece.x, piece.y) + 0.003, trail: true });
  items.push({ k: airborne ? 1e9 : topKeyAt(piece.x, piece.y) + 0.004, piece: true });
  items.sort((a, b) => a.k - b.k);
  for (const it of items) {
    if (it.piece) drawPieceBody(now);
    else if (it.trail) drawTrail();
    else if (it.shadow) drawPieceShadow();
    else drawPlat(it.p, now);
  }

  drawEffects();
}

/* ================= 输入 ================= */
window.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  press();
});
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) {
      if (state === 'over') { if (performance.now() - overAt > 500) startGame(); }
      else if (state === 'ready') startGame();
      else press();
    }
  } else if ((e.code === 'Enter' || e.code === 'KeyR') && state === 'over') {
    startGame();
  } else if (e.code === 'KeyH' && (state === 'ready' || state === 'over')) {
    setMode(mode === 'hard' ? 'normal' : 'hard');
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') release(); });

$('#btnStart').addEventListener('click', startGame);
$('#btnRetry').addEventListener('click', startGame);
$('#btnSwitch').addEventListener('click', () => setMode(mode === 'hard' ? 'normal' : 'hard'));
document.querySelectorAll('.mode').forEach(b => {
  b.addEventListener('click', () => setMode(b.dataset.mode));
});
$('#mute').addEventListener('click', () => {
  muted = !muted;
  $('#mute').textContent = muted ? '🔇' : '🔊';
});
$('#assist').addEventListener('click', () => {
  if (!M.guide) { toast('超难模式 · 无预测'); return; }
  assist = !assist;
  $('#assist').classList.toggle('dim', !assist);
});
window.addEventListener('contextmenu', e => e.preventDefault());

/* ================= 主循环 ================= */
applyMode(loadMode());
reset();
state = 'ready';
window.__jump = () => ({
  state, score, streak, cur, shield, mode,
  cfg: { magnet: CFG.magnet, perfectR: CFG.perfectR, holeTime: CFG.holeTime,
         milestone: CFG.milestone, shieldStreak: CFG.shieldStreak, chargeTime: CFG.chargeTime },
  decaying: plats.filter(p => p.decay != null).length,
  piece: { x: +piece.x.toFixed(1), y: +piece.y.toFixed(1), z: +piece.z.toFixed(1) },
  plats: plats.map(p => ({ x: +p.x.toFixed(1), y: +p.y.toFixed(1), kind: p.kind, axis: p.jumpAxis,
                           sx: p.sx, sy: p.sy, r: p.r, decay: p.decay == null ? null : +p.decay.toFixed(2),
                           timer: +p.timer.toFixed(2), gained: p.gained, escaped: !!p.escaped })),
  fx: { dusts: dusts.length, rings: rings.length, texts: texts.length },
});
window.__setMode = applyMode;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt, now);
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
